apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-init-script
data:
  init-mongo.js: |
    db = db.getSiblingDB('finanzas');

    db.categories.insertMany([
      { name: "Salario", type: "income" },
      { name: "Venta", type: "income" },
      { name: "Comida", type: "expense" },
      { name: "Transporte", type: "expense" },
      { name: "Educación", type: "expense" }
    ]);

    db.transactions.insertMany([
      {
        description: "Pago mensual",
        amount: 1500,
        type: "income",
        category: "Salario",
        date: new Date()
      },
      {
        description: "Almuerzo",
        amount: 20,
        type: "expense",
        category: "Comida",
        date: new Date()
      },
      {
        description: "Pasajes",
        amount: 10,
        type: "expense",
        category: "Transporte",
        date: new Date()
      }
    ]);

    print("✅ Base de datos 'finanzas' inicializada correctamente.");
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init-job
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mongo-init
          image: mongo:6.0
          command:
            - sh
            - -c
            - |
              echo "Esperando a que MongoDB esté listo...";
              for i in $(seq 1 30); do
                if mongosh --host mongodb:27017 --eval "db.adminCommand('ping')" >/dev/null 2>&1; then
                  echo "✅ MongoDB disponible, ejecutando script de inicialización...";
                  mongosh --host mongodb:27017 --file /docker-entrypoint-initdb.d/init-mongo.js;
                  exit 0;
                fi;
                echo "⏳ Esperando a MongoDB ($i/30)...";
                sleep 5;
              done;
              echo "❌ MongoDB no respondió a tiempo.";
              exit 1;
          volumeMounts:
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init-script
          configMap:
            name: mongo-init-script
