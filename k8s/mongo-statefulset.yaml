apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    app: finanzas-mongo
spec:
  ports:
    - port: 27017
      name: mongodb
  clusterIP: None
  selector:
    app: finanzas-mongo
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  labels:
    app: finanzas-mongo
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: finanzas-mongo
  template:
    metadata:
      labels:
        app: finanzas-mongo
    spec:
      securityContext:
        fsGroup: 999
        runAsUser: 999
      containers:
        - name: mongo
          image: mongo:6.0
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: "finanzas"
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
      terminationGracePeriodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "gp3"   # Usa 'gp2' si tu cluster EKS aún no tiene gp3
        resources:
          requests:
            storage: 5Gi
