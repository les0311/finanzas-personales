apiVersion: apps/v1
kind: Deployment
metadata:
  name: finanzas-backend
  labels:
    app: finanzas-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finanzas-backend
  template:
    metadata:
      labels:
        app: finanzas-backend
    spec:
      containers:
        - name: backend
          image: leslym03/finanzas-backend:latest  # o reemplazado por backendImage.imageName si lo defines en Pulumi
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: uri
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: finanzas-backend-svc
spec:
  selector:
    app: finanzas-backend
  ports:
    - port: 80
      targetPort: 3001
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: finanzas-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: finanzas-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
