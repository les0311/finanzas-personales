apiVersion: apps/v1
kind: Deployment
metadata:
  name: finanzas-frontend
  labels:
    app: finanzas-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finanzas-frontend
  template:
    metadata:
      labels:
        app: finanzas-frontend
    spec:
      containers:
        - name: finanzas-frontend
          image: leslym03/finanzas-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: VITE_API_URL
              value: "http://backend-svc:3001/api"   # 👈 URL interna del backend en el cluster
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  labels:
    app: finanzas-frontend
spec:
  selector:
    app: finanzas-frontend
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
